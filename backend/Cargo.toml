[workspace]
resolver = "2"
members = [
    "crates/splendor-pokemon-core",
    "crates/splendor-pokemon-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
thiserror = "2"
splendor-pokemon-core = { path = "crates/splendor-pokemon-core" }
