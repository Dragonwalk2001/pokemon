<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>璀璨宝石：宝可梦 · 对局回放</title>
<style>
  :root {
    --bg: #10131a;
    --panel: #171c26;
    --panel-2: #1e2532;
    --line: #2b3445;
    --text: #e8edf7;
    --muted: #93a0b5;
    --accent: #7c9cff;
    --gold: #f0c15a;
    --red: #e5534b;
    --blue: #4b8ee5;
    --yellow: #d7b545;
    --pink: #e56bb5;
    --black: #8b93a7;
    --master: #a78bfa;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 14px/1.5 "Microsoft YaHei", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
    min-height: 100vh;
  }
  .topbar {
    display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between;
    padding: 16px 22px; border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #182033, #141922);
    position: sticky; top: 0; z-index: 20;
  }
  .brand { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .logo { font-size: 21px; font-weight: 800; letter-spacing: .08em; }
  .logo span { color: var(--gold); margin-left: 6px; }
  .meta { color: var(--muted); font-size: 13px; }
  .meta b { color: var(--text); font-weight: 600; }
  .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  button, select {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 12px; font: inherit; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .35; cursor: default; border-color: var(--line); }
  button.primary { background: #2d4a9e; border-color: #3f63c8; }
  button.primary:hover { background: #3658b8; }
  label { color: var(--muted); font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .timeline {
    display: flex; align-items: center; gap: 14px; padding: 10px 22px;
    border-bottom: 1px solid var(--line); background: #121722;
  }
  .timeline input[type=range] { flex: 1; accent-color: var(--accent); }
  #frameLabel, #phaseLabel { white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
  #phaseLabel { color: var(--accent); font-weight: 600; }
  .banner {
    margin: 14px 22px 0; padding: 12px 18px; border-radius: 10px;
    background: linear-gradient(90deg, #443410, #2a2415); border: 1px solid #7a6024;
    color: #ffe2a0; font-weight: 700; letter-spacing: .04em;
  }
  .banner.hidden { display: none; }
  main {
    display: grid; grid-template-columns: minmax(0, 1fr) 330px;
    gap: 16px; padding: 16px 22px 8px; align-items: start;
  }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .panel h2 {
    margin: 0 0 10px; font-size: 12px; letter-spacing: .18em; color: var(--muted);
    text-transform: uppercase; font-weight: 700;
  }
  .side { display: flex; flex-direction: column; gap: 16px; }
  .players-panel { grid-column: 1 / -1; }
  .board-row { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; margin-bottom: 10px; align-items: stretch; }
  .board-row:last-child { margin-bottom: 0; }
  .row-label {
    color: var(--muted); font-size: 11px; font-weight: 700; padding-top: 8px;
    writing-mode: vertical-rl; letter-spacing: .16em; display: flex; align-items: center;
  }
  .cards { display: flex; flex-wrap: wrap; gap: 8px; }
  .card {
    --card-rgb: 124, 156, 255;
    width: 168px; min-height: 208px; border-radius: 12px; padding: 8px 10px 9px;
    background:
      radial-gradient(115% 80% at 50% -8%, rgba(var(--card-rgb), .50), rgba(var(--card-rgb), .12) 62%, transparent 100%),
      linear-gradient(170deg, rgba(var(--card-rgb), .24), #141922 78%);
    border: 1px solid rgba(var(--card-rgb), .55);
    box-shadow: 0 6px 16px rgba(0, 0, 0, .28), inset 0 1px 0 rgba(255, 255, 255, .08);
    display: flex; flex-direction: column; gap: 4px;
  }
  .card.bonus-red { --card-rgb: 229, 83, 75; }
  .card.bonus-blue { --card-rgb: 75, 142, 229; }
  .card.bonus-yellow { --card-rgb: 215, 181, 69; }
  .card.bonus-pink { --card-rgb: 229, 107, 181; }
  .card.bonus-black { --card-rgb: 139, 147, 167; }
  .card.empty {
    opacity: .35; align-items: center; justify-content: center;
    background: var(--panel-2); border: 1px dashed var(--line); box-shadow: none;
  }
  .card-head { display: flex; justify-content: space-between; gap: 6px; align-items: center; }
  .card-cat { font-size: 10px; font-weight: 700; letter-spacing: .16em; color: var(--muted); }
  .card.level1 .card-cat { color: #9fbf93; }
  .card.level2 .card-cat { color: #8ab4f8; }
  .card.level3 .card-cat { color: #cfa6ef; }
  .card.rare .card-cat { color: var(--gold); }
  .card.legendary .card-cat { color: #ff9c85; }
  .card-glyph {
    flex: 1 1 auto; min-height: 82px; margin-top: 1px;
    display: grid; place-items: center;
    font-size: 46px; font-weight: 900; line-height: 1; color: #fff; white-space: nowrap;
    letter-spacing: .01em;
    text-shadow: 0 2px 0 rgba(0, 0, 0, .3), 0 0 26px rgba(var(--card-rgb), .8);
    background: radial-gradient(circle at 50% 46%, rgba(255, 255, 255, .16), transparent 66%);
  }
  .card-bottom { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }
  .card-evo {
    display: flex; align-items: center; justify-content: space-between; gap: 4px;
    font-size: 10px; color: #d9c9ff;
  }
  .card-evo .evo-target { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-evo .evo-req { display: inline-flex; align-items: center; gap: 3px; flex: none; font-weight: 700; }
  .card-cost { display: flex; align-items: center; gap: 3px; align-self: flex-start; }
  .ball {
    width: 19px; height: 19px; border-radius: 50%; flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 800; line-height: 1;
    border: 1px solid rgba(255, 255, 255, .35);
    box-shadow: inset 0 -2px 4px rgba(0, 0, 0, .3), 0 1px 2px rgba(0, 0, 0, .3);
  }
  .ball.red { background: var(--red); color: #fff; }
  .ball.blue { background: var(--blue); color: #fff; }
  .ball.yellow { background: var(--yellow); color: #2a2408; }
  .ball.pink { background: var(--pink); color: #2c0f21; }
  .ball.black { background: var(--black); color: #14161c; }
  .ball.master { background: var(--master); color: #1a1230; }
  .card-cost .free { font-size: 10px; color: var(--muted); padding-left: 2px; }
  .points {
    background: #2d4a9e; color: #fff; border-radius: 999px; padding: 0 8px;
    font-size: 12px; font-weight: 800; line-height: 20px; white-space: nowrap;
  }
  .points.zero { background: #2a3140; color: var(--muted); }
  .line { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .pill {
    display: inline-flex; align-items: center; gap: 4px; border-radius: 999px;
    padding: 1px 7px; background: #232b3a; color: var(--text); font-size: 11px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  .c-red { background: var(--red); } .c-blue { background: var(--blue); }
  .c-yellow { background: var(--yellow); } .c-pink { background: var(--pink); }
  .c-black { background: var(--black); } .c-master { background: var(--master); }
  .token-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .token {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px;
    padding: 8px 9px; display: flex; align-items: center; gap: 7px;
  }
  .token .count { margin-left: auto; font-weight: 800; font-size: 16px; font-variant-numeric: tabular-nums; }
  .token.zero { opacity: .4; }
  .action-box { display: flex; flex-direction: column; gap: 9px; }
  .action-main { font-size: 16px; font-weight: 700; color: var(--gold); }
  .action-actor { color: var(--muted); font-size: 12px; }
  .events { margin: 0; padding-left: 16px; color: var(--muted); font-size: 12px; max-height: 190px; overflow: auto; }
  .events li { margin-bottom: 3px; }
  .players { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
  .player {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; display: flex; flex-direction: column; gap: 7px;
  }
  .player.current { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .player-head { display: flex; align-items: center; gap: 8px; }
  .player-name { font-weight: 800; }
  .badge { font-size: 10px; padding: 1px 7px; border-radius: 999px; background: #2d4a9e; color: #dfe8ff; }
  .player-score { margin-left: auto; font-size: 22px; font-weight: 900; color: var(--gold); font-variant-numeric: tabular-nums; }
  .player-score small { font-size: 10px; color: var(--muted); font-weight: 500; margin-left: 2px; }
  .kv { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 11px; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { font-size: 10px; padding: 1px 6px; border-radius: 5px; background: #232b3a; color: #b9c4d8; }
  .hidden { display: none !important; }
  footer { padding: 10px 22px 24px; color: #66728a; font-size: 11px; }
  @media (max-width: 900px) {
    main { grid-template-columns: minmax(0, 1fr); }
    .side { grid-row: 2; }
    .players-panel { grid-column: auto; }
    .token-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo">璀璨宝石<span>宝可梦</span></div>
    <div class="meta" id="meta"></div>
  </div>
  <div class="controls">
    <button id="prev" title="上一步（←）">◀ 上一步</button>
    <button id="play" class="primary" title="播放 / 暂停（空格）">▶ 自动播放</button>
    <button id="next" title="下一步（→）">下一步 ▶</button>
    <label>速度
      <select id="speed">
        <option value="1800">慢</option>
        <option value="1000" selected>中</option>
        <option value="550">快</option>
        <option value="250">极快</option>
      </select>
    </label>
  </div>
</header>

<div class="timeline">
  <span id="frameLabel">0 / 0</span>
  <input type="range" id="slider" min="0" max="0" value="0" step="1" aria-label="回放进度">
  <span id="phaseLabel"></span>
</div>

<div id="banner" class="banner hidden"></div>

<main>
  <section class="panel board-panel">
    <h2>场上牌</h2>
    <div id="board"></div>
  </section>

  <aside class="side">
    <section class="panel">
      <h2>供应区</h2>
      <div id="supply" class="token-grid"></div>
    </section>
    <section class="panel">
      <h2>最近动作</h2>
      <div id="action" class="action-box"></div>
    </section>
  </aside>

  <section class="panel players-panel">
    <h2>玩家</h2>
    <div id="players" class="players"></div>
  </section>
</main>

<footer>← / → 步进 · 空格 播放/暂停 · 种子 <span id="seed"></span> · 单文件离线回放</footer>

<script id="replay-data" type="application/json">__REPLAY_JSON__</script>
<script>
(() => {
  "use strict";

  const replay = JSON.parse(document.getElementById("replay-data").textContent);
  const COLORS = [
    { key: "red", label: "红" },
    { key: "blue", label: "蓝" },
    { key: "yellow", label: "黄" },
    { key: "pink", label: "粉" },
    { key: "black", label: "黑" },
    { key: "master", label: "大师" },
  ];
  const PHASES = {
    main_action: "主要行动",
    discard: "弃球",
    evolution: "进化 / 结束回合",
    game_over: "终局",
  };
  const CATEGORIES = [
    { key: "level1", board: "level1", label: "1 阶" },
    { key: "level2", board: "level2", label: "2 阶" },
    { key: "level3", board: "level3", label: "3 阶" },
    { key: "rare", board: "rare", label: "稀有" },
    { key: "legendary", board: "legendary", label: "传说" },
  ];
  const CONTROLLERS = { human: "玩家", random: "随机 bot", heuristic: "启发式 bot" };

  const $ = (id) => document.getElementById(id);
  const frames = Array.isArray(replay.frames) ? replay.frames : [];
  let index = 0;
  let playing = false;
  let timer = null;

  function node(tag, className, text) {
    const element = document.createElement(tag);
    if (className) element.className = className;
    if (text !== undefined) element.textContent = text;
    return element;
  }

  function clear(element) {
    while (element.firstChild) element.removeChild(element.firstChild);
  }

  function colorLabel(key) {
    const found = COLORS.find((color) => color.key === key);
    return found ? found.label : key;
  }

  function categoryLabel(key) {
    const found = CATEGORIES.find((category) => category.key === key);
    return found ? found.label : key;
  }

  function glyphFontSize(name) {
    const length = Math.max([...name].length, 1);
    return Math.min(56, Math.floor(140 / length));
  }

  function playerName(view, id) {
    const player = view.players.find((item) => item.id === id);
    return player ? player.name : `玩家 ${id}`;
  }

  function tokenPills(tokens, includeZero) {
    const wrap = node("div", "line");
    for (const color of COLORS) {
      const count = tokens[color.key] || 0;
      if (!includeZero && count === 0) continue;
      const pill = node("span", "pill");
      pill.append(node("span", `dot c-${color.key}`));
      pill.append(document.createTextNode(`${color.label} ${count}`));
      wrap.append(pill);
    }
    if (!wrap.childNodes.length) wrap.append(node("span", "chip", "无"));
    return wrap;
  }

  function costNode(cost) {
    const wrap = node("div", "card-cost");
    wrap.title = "捕捉费用";
    let hasCost = false;
    if (cost) {
      for (const color of COLORS) {
        const count = cost[color.key] || 0;
        if (count === 0) continue;
        hasCost = true;
        const ball = node("span", `ball ${color.key}`, String(count));
        ball.title = `${color.label} ${count}`;
        wrap.append(ball);
      }
    }
    if (!hasCost) wrap.append(node("span", "free", "免费"));
    return wrap;
  }

  function cardNode(card) {
    const element = node("div", `card ${card.category} bonus-${card.bonus_color}`);
    const head = node("div", "card-head");
    head.append(node("span", "card-cat", categoryLabel(card.category)));
    const points = node("span", card.points > 0 ? "points" : "points zero", `${card.points}`);
    head.append(points);
    element.append(head);

    const glyph = node("div", "card-glyph", card.name_zh);
    glyph.style.fontSize = `${glyphFontSize(card.name_zh)}px`;
    element.append(glyph);

    const bottom = node("div", "card-bottom");
    if (card.evolves_to_zh && card.evolution_requirement) {
      const requirement = card.evolution_requirement;
      const evo = node("div", "card-evo");
      evo.append(node("span", "evo-target", `→ ${card.evolves_to_zh}`));
      const req = node("span", "evo-req");
      req.append(document.createTextNode(String(requirement.count)));
      req.append(node("span", `dot c-${requirement.color}`));
      evo.append(req);
      evo.title = `进化：需 ${requirement.count}${colorLabel(requirement.color)}减免`;
      bottom.append(evo);
    }
    bottom.append(costNode(card.cost));
    element.append(bottom);
    return element;
  }

  function emptyCard() {
    return node("div", "card empty", "空");
  }

  function supplyTile(color, count) {
    const tile = node("div", count > 0 ? "token" : "token zero");
    tile.append(node("span", `dot c-${color.key}`));
    tile.append(node("span", "", color.label));
    tile.append(node("span", "count", String(count)));
    return tile;
  }

  function renderBoard(view) {
    const board = $("board");
    clear(board);
    for (const category of CATEGORIES) {
      const row = node("div", "board-row");
      row.append(node("div", "row-label", category.label));
      const cards = node("div", "cards");
      const slots = view.board[category.board] || [];
      slots.forEach((card) => cards.append(card ? cardNode(card) : emptyCard()));
      row.append(cards);
      board.append(row);
    }
  }

  function renderSupply(supply) {
    const container = $("supply");
    clear(container);
    for (const color of COLORS) {
      container.append(supplyTile(color, supply[color.key] || 0));
    }
  }

  function playerCard(view, player) {
    const element = node("div", player.id === view.current_player ? "player current" : "player");
    const head = node("div", "player-head");
    head.append(node("span", "player-name", player.name));
    if (player.id === view.current_player) head.append(node("span", "badge", "行动中"));
    const score = node("span", "player-score");
    score.append(document.createTextNode(String(player.points)));
    score.append(node("small", "", "分"));
    head.append(score);
    element.append(head);

    element.append(tokenPills(player.tokens, true));

    const bonusWrap = node("div", "line");
    bonusWrap.append(node("span", "chip", "减免"));
    for (const color of COLORS.slice(0, 5)) {
      const count = player.bonuses[color.key] || 0;
      if (count === 0) continue;
      const pill = node("span", "pill");
      pill.append(node("span", `dot c-${color.key}`));
      pill.append(document.createTextNode(String(count)));
      bonusWrap.append(pill);
    }
    if (bonusWrap.childNodes.length === 1) bonusWrap.append(node("span", "chip", "无"));
    element.append(bonusWrap);

    const stats = node("div", "kv");
    stats.append(node("span", "chip", `捕捉 ${player.card_count}`));
    stats.append(node("span", "chip", `保留 ${player.reserved_count} / 3`));
    stats.append(node("span", "chip", `进化 ${player.evolution_count}`));
    stats.append(node("span", "chip", `已行动 ${player.turns_taken} 回合`));
    element.append(stats);

    const captured = node("div", "chips");
    if (player.captured.length) {
      for (const card of player.captured) {
        captured.append(node("span", "chip", `${card.name_zh} ${card.points}分`));
      }
    } else {
      captured.append(node("span", "chip", "尚无宝可梦"));
    }
    element.append(captured);

    if (Array.isArray(player.reserved)) {
      const reserved = node("div", "chips");
      if (player.reserved.length) {
        for (const card of player.reserved) {
          reserved.append(node("span", "chip", `保留：${card.name_zh} ${card.points}分`));
        }
      } else {
        reserved.append(node("span", "chip", "保留牌：无"));
      }
      element.append(reserved);
    } else if (player.reserved_count > 0) {
      element.append(node("div", "kv", `保留牌：${player.reserved_count} 张（未公开）`));
    }

    return element;
  }

  function renderPlayers(view) {
    const container = $("players");
    clear(container);
    for (const player of view.players) {
      container.append(playerCard(view, player));
    }
  }

  function renderAction(frame, view) {
    const container = $("action");
    clear(container);
    if (frame.actor === null || frame.actor === undefined) {
      container.append(node("div", "action-main", "开局"));
      container.append(node("div", "action-actor", "等待第一位玩家行动"));
    } else {
      container.append(node("div", "action-main", frame.action_text || "—"));
      container.append(node("div", "action-actor", `${playerName(view, frame.actor)} 执行`));
    }

    const events = node("ul", "events");
    if (frame.events && frame.events.length) {
      for (const text of frame.events) events.append(node("li", "", text));
    } else {
      events.append(node("li", "", "本步没有新事件"));
    }
    container.append(events);
  }

  function renderMeta(view) {
    const container = $("meta");
    clear(container);
    container.append(document.createTextNode(`种子 ${replay.seed} · ${replay.players.length} 人 · `));
    const turn = node("b", "", `第 ${view.turn_number} 回合`);
    container.append(turn);
    container.append(document.createTextNode(" · "));
    const names = replay.players
      .map((name, id) => `${name}（${CONTROLLERS[replay.controllers[id]] || replay.controllers[id] || "?"}）`)
      .join("、");
    container.append(document.createTextNode(names));
    $("seed").textContent = String(replay.seed);
  }

  function renderBanner(view) {
    const banner = $("banner");
    if (replay.stalemate && index === frames.length - 1) {
      banner.textContent = "对局僵局 · 供应区耗尽且当前玩家没有合法主行动（规则未定义 pass，无胜者）";
      banner.classList.remove("hidden");
      return;
    }
    if (!Array.isArray(view.winners) || view.winners.length === 0) {
      banner.classList.add("hidden");
      banner.textContent = "";
      return;
    }
    const names = view.winners.map((id) => playerName(view, id)).join("、");
    const scores = view.winners
      .map((id) => {
        const player = view.players.find((item) => item.id === id);
        return player ? `${player.points} 分` : "";
      })
      .filter(Boolean)
      .join(" / ");
    banner.textContent = `对局结束 · 胜者：${names}${scores ? `（${scores}）` : ""}`;
    banner.classList.remove("hidden");
  }

  function updateControls(view) {
    const last = frames.length - 1;
    $("frameLabel").textContent = `${index + 1} / ${frames.length}`;
    $("phaseLabel").textContent =
      replay.stalemate && index === frames.length - 1
        ? "僵局"
        : PHASES[view.phase] || view.phase;
    const slider = $("slider");
    slider.max = String(Math.max(last, 0));
    slider.value = String(index);
    $("prev").disabled = index <= 0;
    $("next").disabled = index >= last;
    $("play").textContent = playing ? "⏸ 暂停" : "▶ 自动播放";
  }

  function render() {
    if (!frames.length) {
      $("board").textContent = "回放没有帧数据";
      return;
    }
    const frame = frames[index];
    const view = frame.view;
    renderMeta(view);
    renderBoard(view);
    renderSupply(view.supply);
    renderAction(frame, view);
    renderPlayers(view);
    renderBanner(view);
    updateControls(view);
  }

  function go(target) {
    if (!frames.length) return;
    index = Math.max(0, Math.min(frames.length - 1, target));
    render();
  }

  function stopPlaying() {
    if (timer !== null) {
      clearInterval(timer);
      timer = null;
    }
    playing = false;
    $("play").textContent = "▶ 自动播放";
  }

  function startPlaying() {
    if (!frames.length) return;
    if (index >= frames.length - 1) index = 0;
    if (timer !== null) clearInterval(timer);
    playing = true;
    $("play").textContent = "⏸ 暂停";
    render();
    timer = setInterval(() => {
      if (index >= frames.length - 1) {
        stopPlaying();
        return;
      }
      go(index + 1);
    }, Number($("speed").value));
  }

  $("prev").addEventListener("click", () => {
    stopPlaying();
    go(index - 1);
  });
  $("next").addEventListener("click", () => {
    stopPlaying();
    go(index + 1);
  });
  $("play").addEventListener("click", () => {
    if (playing) stopPlaying();
    else startPlaying();
  });
  $("slider").addEventListener("input", (event) => {
    stopPlaying();
    go(Number(event.target.value));
  });
  $("speed").addEventListener("change", () => {
    if (playing) startPlaying();
  });
  document.addEventListener("keydown", (event) => {
    const tag = event.target && event.target.tagName;
    if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
    if (event.key === "ArrowLeft") {
      event.preventDefault();
      stopPlaying();
      go(index - 1);
    } else if (event.key === "ArrowRight") {
      event.preventDefault();
      stopPlaying();
      go(index + 1);
    } else if (event.key === " ") {
      event.preventDefault();
      if (playing) stopPlaying();
      else startPlaying();
    }
  });

  render();
})();
</script>
</body>
</html>
